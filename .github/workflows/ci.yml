name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails only on high or critical advisories in code the site ships (the
      # bundle's packages and their dependencies); build and test tools are listed.
      - name: Audit shipped dependencies
        run: node scripts/audit-shipped.mjs --audit-level=high

      # The sysml-toolkit engine (pinned in toolkit.json): the app's engine, and the unit tests'.
      - name: Cache toolkit download
        uses: actions/cache@v4
        with:
          path: .cache/toolkit
          key: toolkit-${{ hashFiles('toolkit.json') }}
      - name: Fetch toolkit
        run: scripts/fetch-toolkit.sh
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The browser tests, a third each on three runners: run one after the other
  # they take longer than a job may.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache toolkit download
        uses: actions/cache@v4
        with:
          path: .cache/toolkit
          key: toolkit-${{ hashFiles('toolkit.json') }}
      - name: Fetch toolkit
        run: scripts/fetch-toolkit.sh

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The test server builds the site first (playwright.config.ts).
      - name: End-to-end and accessibility tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
