name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails only on high or critical advisories in code the site ships (the
      # bundle's packages and their dependencies); build and test tools are listed.
      - name: Audit shipped dependencies
        run: node scripts/audit-shipped.mjs --audit-level=high

      # The sysml-toolkit engine (pinned in toolkit.json): the app's engine, and the unit tests'.
      - name: Cache toolkit download
        uses: actions/cache@v4
        with:
          path: .cache/toolkit
          key: toolkit-${{ hashFiles('toolkit.json') }}
      - name: Fetch toolkit
        run: scripts/fetch-toolkit.sh
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
