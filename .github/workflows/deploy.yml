name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The sysml-toolkit engine (pinned in toolkit.json).
      - name: Fetch toolkit
        run: scripts/fetch-toolkit.sh

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /sysml-web
          # "Sign in with GitHub" (docs/setup-github-sign-in.md). Repository Actions
          # variables; while they are unset, people connect with an access token.
          PUBLIC_GITHUB_CLIENT_ID: ${{ vars.PUBLIC_GITHUB_CLIENT_ID }}
          PUBLIC_GITHUB_APP_SLUG: ${{ vars.PUBLIC_GITHUB_APP_SLUG }}
          PUBLIC_SYNC_WORKER: ${{ vars.PUBLIC_SYNC_WORKER }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
