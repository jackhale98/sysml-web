name: Deploy worker

# The sign-in worker (worker/), deployed to Cloudflare by hand. Needs a
# CLOUDFLARE_API_TOKEN repository secret (token template "Edit Cloudflare
# Workers"). Not needed if Cloudflare builds the worker from the repository
# itself; use one or the other. See docs/setup-github-sign-in.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy
