name: Build SysML engine
description: Build sysml-wasm from the sysml-cli revision pinned in engine.json into static/engine/.
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-bindgen
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@0.2.129

    - name: Cache engine build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          .cache/sysml-cli
        key: engine-${{ runner.os }}-${{ hashFiles('engine.json') }}

    - name: Build engine
      shell: bash
      run: scripts/build-engine.sh
